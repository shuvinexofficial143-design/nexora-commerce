name: Nexora Automated QA

on:
  push:
    branches:
      - feature/nexora-qa-automation
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      http_smoke:
        description: "Opt in to isolated local HTTP smoke checks"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nexora-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Commerce unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run isolated QA suite
        run: npx --no-install tsx --test tests/*.test.ts

  security-audit:
    name: Full advisory report and strict production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture full and production npm audit JSON
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > "$RUNNER_TEMP/nexora-audit-full.json"
          full_status=$?
          npm audit --omit=dev --json > "$RUNNER_TEMP/nexora-audit-production.json"
          prod_status=$?
          set -e
          echo "Full audit exit: $full_status; production JSON audit exit: $prod_status"
          if (( full_status > 1 || prod_status > 1 )); then
            echo "::error::npm audit failed to retrieve advisory data"
            exit 2
          fi
      - name: Summarize exact affected dependencies
        run: node scripts/qa/audit-report.mjs "$RUNNER_TEMP/nexora-audit-full.json" "$RUNNER_TEMP/nexora-audit-production.json"
      - name: Enforce production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Save npm audit JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-qa-security-audit
          path: ${{ runner.temp }}/nexora-audit-*.json
          if-no-files-found: warn

  application-validation:
    name: Lint, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build without deploying
        env:
          NODE_ENV: production
        run: npm run build

  local-http-smoke:
    name: Local HTTP smoke (QA branch push or opt-in)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.http_smoke == true)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build local isolated application
        env:
          NODE_ENV: production
          DATABASE_URL: ""
          DIRECT_URL: ""
          PUBLIC_CUSTOMER_AUTH_ENABLED: "false"
          NEXT_PUBLIC_CASHFREE_ENABLED: "false"
        run: npm run build
      - name: Start local web server and smoke test
        shell: bash
        env:
          DATABASE_URL: ""
          DIRECT_URL: ""
          PUBLIC_CUSTOMER_AUTH_ENABLED: "false"
          NEXT_PUBLIC_CASHFREE_ENABLED: "false"
          NEXORA_QA_BASE_URL: http://127.0.0.1:3137
        run: |
          set -euo pipefail
          npm run start -- --port 3137 > "$RUNNER_TEMP/nexora-local-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/qa/http-smoke.mjs
      - name: Save local HTTP server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-qa-local-server-logs
          path: ${{ runner.temp }}/nexora-local-server.log
          if-no-files-found: warn

  isolated-postgres-integration:
    name: Temporary PostgreSQL checkout invariants
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora_qa
          POSTGRES_PASSWORD: qa-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: nexora_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_qa -d nexora_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nexora_qa:qa-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/nexora_qa
      DIRECT_URL: postgresql://nexora_qa:qa-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/nexora_qa
      NEXORA_QA_ALLOW_DB_INTEGRATION: "true"
      PUBLIC_CUSTOMER_AUTH_ENABLED: "false"
      CASHFREE_CLIENT_ID: ""
      CASHFREE_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      # Repository currently contains no prisma/migrations. Schema sync is restricted to the ephemeral service.
      - name: Synchronize Prisma schema to ephemeral PostgreSQL only
        run: npx --no-install prisma db push
      - name: Execute checkout and inventory integration invariants (real database)
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx --test tests/integration/*.test.ts 2>&1 | tee "$RUNNER_TEMP/nexora-postgres-integration.log"
      - name: Always retain genuine integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-qa-postgres-integration
          path: ${{ runner.temp }}/nexora-postgres-integration.log
          if-no-files-found: warn

  chromium-browser-e2e:
    name: Isolated Chromium desktop and mobile regression
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ""
      DIRECT_URL: ""
      PUBLIC_CUSTOMER_AUTH_ENABLED: "false"
      NEXT_PUBLIC_CASHFREE_ENABLED: "false"
      NEXORA_QA_BASE_URL: http://127.0.0.1:3137/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install Chromium testing runtime outside repository
        shell: bash
        run: |
          set -euo pipefail
          echo "NEXORA_QA_PLAYWRIGHT_DIR=$RUNNER_TEMP/nexora-qa-browser" >> "$GITHUB_ENV"
          echo "NEXORA_QA_EVIDENCE_DIR=$RUNNER_TEMP/nexora-qa-browser-evidence" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/nexora-qa-browser" --no-save --no-package-lock --no-audit playwright@1.56.1
          "$RUNNER_TEMP/nexora-qa-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build local application
        env:
          NODE_ENV: production
        run: npm run build
      - name: Execute actual Chromium browser flows
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3137 > "$RUNNER_TEMP/nexora-qa-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/qa/browser-e2e.mjs 2>&1 | tee "$RUNNER_TEMP/nexora-qa-browser-output.log"
      - name: Save browser screenshots, results and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-qa-chromium-evidence
          path: |
            ${{ runner.temp }}/nexora-qa-browser-evidence/**
            ${{ runner.temp }}/nexora-qa-browser-server.log
            ${{ runner.temp }}/nexora-qa-browser-output.log
          if-no-files-found: warn
